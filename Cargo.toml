[package]
name = "web_ssr_arena"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [".", "load"]

[dependencies]
load = { path = "load" }
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = true
