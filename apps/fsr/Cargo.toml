[package]
name = "outfitters_fsr"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
snapfire_fsr_core = "0"
snapfire_fsr_host = "0"
snapfire_fsr_macros = "0"
snapfire_fsr_runtime = "0"
snapfire_fsr_service = "0"
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = true
