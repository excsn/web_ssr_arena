#:schema ../app/generated/config.schema.json
[server]
listen = "127.0.0.1:3101"
prerender = "dist/prerender"

[document]
title = "Outfitters"
origin = "http://127.0.0.1:3101"

# Reported, not enforced. Rename the table to [document.csp] to enforce it.
[document.csp_report_only]
default-src = ["'self'"]
script-src = ["'self'"]
base-uri = ["'none'"]
object-src = ["'none'"]
frame-ancestors = ["'self'"]

# The /upstream page's loader calls this app's own /api/products over HTTP.
[clients.upstream]
base_url = "http://127.0.0.1:3101"

[session]
ttl = "24h"

[typecheck]
version = "7.0.2"
