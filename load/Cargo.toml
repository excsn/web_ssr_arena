[package]
name = "load"
version = "0.1.0"
publish = false

edition = "2024"
authors = ["Norm O <normo.pub@gmail.com>"]
license = "MPL-2.0"

[dependencies]
bytes = "1"
fibre_http = "0.5"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "matrix"
path = "src/bin/matrix.rs"
